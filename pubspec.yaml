name: ssc26
description: "SSC26 Study Planner - Smart routine generator for SSC 2026 students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path: ^1.9.0
  
  # Notifications & Alarms
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.6
  timezone: ^0.10.0
  
  # Permissions
  permission_handler: ^11.3.1
  
  # UI Components
  table_calendar: ^3.1.3
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_spinkit: ^5.2.1
  smooth_page_indicator: ^1.2.0+3
  
  # Home Widget
  home_widget: ^0.7.0
  
  # Date/Time
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
